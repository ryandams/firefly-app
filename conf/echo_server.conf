#
# GSFleet UDP echo server that srvNetwork (and the raw-AT tests) send to.
# Added by CMakeLists.txt for every board with a modem, before the modem's
# own conf/modem_<x>.conf (which may still override it).
#
# The server is set up again each day and gets a new port each time - update
# the port here, in this one place.
CONFIG_FIREFLY_NETWORK_DEST_IP="172.188.83.251"
CONFIG_FIREFLY_NETWORK_DEST_PORT=45786
CONFIG_FIREFLY_NETWORK_MESSAGE="test,message,GSFleet,0123456789"
CONFIG_FIREFLY_MODEM_TEST_SERVER_IP="172.188.83.251"
CONFIG_FIREFLY_MODEM_TEST_SERVER_PORT=45786
