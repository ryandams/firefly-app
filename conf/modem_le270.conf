# SPDX-License-Identifier: Apache-2.0
#
# Fibocom LE270 modem wired externally to nrf54lm20dk over uart21 (same
# physical pins as the Quectel EG800Z - boards/le270.overlay). Pair with
# that overlay. Added by CMakeLists.txt when prj.conf sets
# CONFIG_FIREFLY_TARGET_MODEM_LE270.
#
# Unlike the EG800Z, the LE270 documents AT+CMUX (AT Commands User Manual
# V1.6 section 4.16) and standard 3GPP PPP dial-up (ATD*99***1#/CGDATA), so
# it goes through the plain modem_cellular transport
# (FIREFLY_NETWORK_TRANSPORT_MODEM_CELLULAR, this Kconfig choice's default)
# rather than a custom no-CMUX transport like modemEg800zPpp.cpp - see
# drivers/modem/vendor_modem_cellular/cellular_fibocom_le270.c
# (zephyr/patches/zephyr/fibocom-le270-driver.patch).
CONFIG_FIREFLY_NETWORK=y

# Required for setsockopt(SO_RCVTIMEO) to actually bound the echo-reply wait
# in srvNetwork.cpp's modem_send() (CONFIG_FIREFLY_NETWORK_SEND_SETTLE_MS) -
# without it, Zephyr's socket layer silently treats SO_RCVTIMEO as a no-op
# and recv() blocks forever if the destination never replies.
CONFIG_NET_CONTEXT_RCVTIMEO=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_PPP=y
# This modem never acknowledges PPP's LCP Terminate-Request on hangup - it
# just drops the link and sends NO CARRIER instead (subsys/modem/modem_ppp.c
# only logs that, it doesn't call net_if_carrier_off(), so
# subsys/net/l2/ppp/ppp_l2.c's ppp_down() always takes the slower
# ppp_lcp_close() path: it waits CONFIG_NET_L2_PPP_TIMEOUT x
# (1 + CONFIG_NET_L2_PPP_MAX_TERMINATE_REQ_RETRANSMITS) for an ack that
# never comes - 3000 x (1+2) = 9000ms with the stock defaults, confirmed on
# real hardware (net_if_down(PPP) itself measured at 9.003s, identical
# across multiple rounds - a deterministic timeout, not network jitter).
# That stall gives modem_cellular's own state machine enough time to see
# NET_EVENT_PPP_PHASE_DEAD and start its automatic-redial recovery path
# before srvNetwork's own pm_device_runtime_put() can land cleanly,
# occasionally cascading into several minutes of the driver retrying a dead
# link before giving up (see zephyr/patches/zephyr/
# modem-cellular-suspend-during-ppp-dead.patch's changelog). Cut to 1000ms x
# (1+1) = 2000ms: a real margin over any genuine ack (confirmed round-trips
# elsewhere in this project run well under 100ms), nowhere close to the old
# 9s. Properly fixing modem_ppp.c to call net_if_carrier_off() on NO CARRIER
# (making ppp_down() take the already-fast ppp_lcp_lower_down() path
# instead) would be the more correct fix, but that's shared Zephyr-subsystem
# code - try this Kconfig-only change first.
#
# MAX_TERMINATE_REQ_RETRANSMITS must stay >= 1, NOT 0, even though 0 looks
# like the "fastest" setting - it triggers a real bug in Zephyr's own
# subsys/net/l2/ppp/fsm.c. terminate() does
# "fsm->retransmits = MAX_TERMINATE_REQ;" then sends one Terminate-Req and
# immediately checks "if (fsm->retransmits == 0)" - with RETRANSMITS=0 that
# is true right away (before any wait), and that early-exit branch passes
# its *intermediate* next_state (PPP_CLOSING) straight to the fsm's
# cb.finished() callback, instead of resolving to PPP_CLOSED the way the
# normal retry-then-timeout path (ppp_fsm_timeout()'s PPP_CLOSING case)
# does. The LCP fsm is then stuck in PPP_CLOSING permanently:
# ppp_fsm_lower_up() has no case for PPP_CLOSING (falls to the default
# no-op), and ppp_fsm_open()'s PPP_CLOSING case only resumes negotiation if
# the FSM_RESTART flag happens to be set, which it never is for LCP/IPCP
# anywhere in this tree (confirmed via grep - nothing ever sets it). First
# round after flashing still works (LCP starts from a fresh PPP_INITIAL
# state), but every round after that silently sends zero PPP traffic
# forever (confirmed on real hardware: round 2 polled AT+CEREG?/AT+CSQ
# successfully every 2s for the full 120s connect timeout, while ch2 - the
# PPP data channel - carried nothing in either direction at all) until
# srvNetwork's own 120s connect timeout gives up. RETRANSMITS=1 avoids the
# buggy immediate-exit branch entirely (retransmits is 1, not 0, when that
# check runs) and takes the normal wait-then-resolve-to-CLOSED path
# instead, for a total worst case of 1000ms x (1+1) = 2000ms - still a huge
# improvement over the old 9000ms, and actually correct.
CONFIG_NET_L2_PPP_TIMEOUT=1000
CONFIG_NET_L2_PPP_MAX_TERMINATE_REQ_RETRANSMITS=1
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# Network management (drives the L4-connected event srvNetwork waits on)
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y

# Modem driver
CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y

# LE270-EU datasheet lists this variant's APN as unspecified/carrier
# default - same SIM/carrier as the other modem targets, which reject the
# "internet" APN CONFIG_MODEM_CELLULAR_APN defaults to.
CONFIG_MODEM_CELLULAR_APN="gsfleet.cxn"

# Same GSFleet UDP echo server the other two modem_cellular/PPP targets use
# (boards/nrf93m1dk_nrf54l15_cpuapp.conf: port 48695; conf/modem_eg800z.conf:
# port 49167) so a received packet can actually be confirmed server-side,
# rather than the Kconfig defaults (8.8.8.8:4242, which nothing listens on).
# A distinct port per target, matching that existing convention, so the
# server side can tell which modem/path a packet came from.
CONFIG_FIREFLY_NETWORK_DEST_IP="172.188.83.251"
CONFIG_FIREFLY_NETWORK_DEST_PORT=45786
CONFIG_FIREFLY_NETWORK_MESSAGE="test,message,GSFleet,0123456789"

CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_USE_DEDICATED_WQ=y

# AT command channel over CMUX's second DLCI, available at the same time as
# the PPP data channel on the first. cellular_fibocom_le270.c only wires up
# one CMUX user pipe (DLCI 3, index 0) - the AT Commands User Manual
# documents "up to 3 channels of CMUX multiplexing" for this series, one
# fewer than the nRF93M1/EG800Z template's two user pipes - so
# MODEM_AT_USER_PIPE_IDX stays at 0 (there is no pipe 1 to pick instead).
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_MODEM_AT_SHELL=y
CONFIG_MODEM_AT_USER_PIPE_IDX=0
CONFIG_MODEM_AT_SHELL_CHAT_RECEIVE_BUF_SIZE=256

# MODEM_AT_SHELL is "depends on !SHELL_WILDCARD" (drivers/modem/
# Kconfig.at_shell), and SHELL_WILDCARD defaults to y as soon as SHELL is
# enabled above - without turning it off, MODEM_AT_SHELL=y is silently
# dropped by Kconfig (no error, no warning, just no `at` shell command at
# runtime). Confirmed: it was missing from this file and MODEM_AT_SHELL
# was absent from the resolved .config entirely. Losing shell wildcards
# (`log enable dbg net*`) is the trade - same fix conf/modem_eg800z.conf
# already carries.
CONFIG_SHELL_WILDCARD=n

# UART async API + buffer sizes, matching the nRF93M1/EG800Z targets' own
# tuning for this class of CMUX modem. NOT CONFIG_MODEM_BACKEND_UART_ASYNC_HWFC:
# on real hardware (this project's Fibocom LE270 ADP), enabling it left the
# UARTE permanently unable to transmit ("Transmit aborted (0 sent)") - it
# waits for its own CTS input to be asserted before sending a byte, and that
# never happened, even though the modem's boot banners arrived on RX just
# fine. boards/le270.overlay drops RTS/CTS from the pinctrl entirely to
# match - see that file's comment for the full story. Falling back to
# MODEM_BACKEND_UART_ASYNC (no flow control, selected automatically once
# HWFC is off and UART_ASYNC_API is on) matches the module's own default
# boot state: the driver never sends AT+IFC to switch it into hardware flow
# control mode.
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_ASYNC_API=y
CONFIG_SHELL_BACKEND_SERIAL_API_ASYNC=y
CONFIG_MODEM_BACKEND_UART_ASYNC_RECEIVE_IDLE_TIMEOUT_MS=1
CONFIG_MODEM_CMUX_MTU=127
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE_EXTRA=532
CONFIG_MODEM_CELLULAR_UART_BUFFER_SIZES=532
CONFIG_MODEM_CMUX_MSC_FC_THRESHOLD=32
CONFIG_MODEM_CELLULAR_USER_PIPE_BUFFER_SIZES=1024

# Full modem debug logging until the link is confirmed stable on real
# hardware, matching how the other two CMUX targets were first brought up -
# see conf/modem_eg800z.conf's longer explanation of why _INF hides which
# AT command actually failed.
#
# CONFIG_MODEM_MODULES_LOG_LEVEL_DBG already makes modem_chat log every line
# it receives, matched or not (modem_chat_log_received_command /
# modem_chat_on_unknown_command_received in modem_chat.c both fire
# unconditionally at DBG) - this is what showed the ^boot.rom'v/+SIM READY
# banners and the AT+CMEE=1/ERROR exchange with nothing filtered out. That
# only covers the AT channel's decoded text, though, and only before/after
# CMUX - once AT+CMUX switches the UART into multiplexed framing, the
# multiplexed bytes underneath (both the AT DLCI and the PPP DLCI) aren't
# visible at the chat layer at all. CMUX_LOG_LEVEL_DBG + CMUX_LOG_FRAMES
# hex-dumps every CMUX frame's payload in both directions
# (modem_cmux.c:frame_log(), LOG_HEXDUMP_DBG) - this is the only way to see
# what actually crosses the UART once multiplexing is active, including the
# PPP channel's raw (unprintable) bytes. Expect this to be very verbose once
# PPP is actually passing UDP traffic; drop back to CMUX_LOG_LEVEL_INF (no
# CMUX_LOG_FRAMES) once the link is confirmed stable.
CONFIG_MODEM_CMUX_LOG_LEVEL_DBG=y
CONFIG_MODEM_CMUX_LOG_FRAMES=y
CONFIG_MODEM_MODULES_LOG_LEVEL_DBG=y

# CMUX frame hex dumps are large - the 16384-byte deferred-logging buffer
# that was enough for chat-only DBG logging will drop messages once frame
# dumps are added on top (silently, mid-line - deferred logging just
# discards what doesn't fit). Doubled for headroom.
CONFIG_LOG_BUFFER_SIZE=32768

# SHELL_LOG_BACKEND defaults to y whenever SHELL is enabled (CONFIG_SHELL=y
# above), and the base board conf enables LOG_BACKEND_UART unconditionally.
# Both write the same console UART, so every log line is emitted twice with
# a "uart:~$" prompt redrawn between the copies - this is exactly why the
# first real-hardware capture (AT+CMEE=1 aborting the init script) came
# back with lines appearing duplicated and seemingly out of order. Turning
# the standalone UART backend off leaves the shell's own log backend as the
# single console writer, matching conf/modem_eg800z.conf's own fix.
CONFIG_LOG_BACKEND_UART=n
