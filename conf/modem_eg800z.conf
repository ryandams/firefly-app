# SPDX-License-Identifier: Apache-2.0
#
# Quectel EG800Z modem wired externally to nrf54lm20dk over uart21.
# Pair with boards/eg800z.overlay. Selected by the outer firefly repo's
# 32_build.sh via -DEXTRA_CONF_FILE/-DEXTRA_DTC_OVERLAY_FILE.
#
# ---------------------------------------------------------------------------
#  srvModemTest_eg800z: raw-AT Quectel EG800Z test over uart21 (no PPP/CMUX)
# ---------------------------------------------------------------------------
#  FIREFLY_MODEM_SERVICE is a Kconfig choice - FIREFLY_MODEM_TEST_EG800Z and
#  FIREFLY_NETWORK (below) can't both be y at once. To switch to the
#  raw-AT test instead of the PPP network path below: comment out the
#  FIREFLY_NETWORK block, then uncomment the three lines below.
# CONFIG_FIREFLY_MODEM_TEST_EG800Z=y
# CONFIG_MODEM=n
# CONFIG_NETWORKING=n

# ---------------------------------------------------------------------------
#  srvNetwork: Quectel EG800Z modem over uart21, direct PPP (no CMUX)
#  ---------------------------------------------------------------------------
#  This module has no AT+CMUX - the command appears nowhere in the AT Commands
#  Manual V1.0 - so there is no multiplexed AT channel alongside PPP and no
#  modem_cellular driver in this path. modemEg800zPpp.cpp owns the UART and
#  follows the PPP Application Note V1.1: command mode for setup, ATD*99# into
#  data mode, and DTR/+++/ATO to move between the two.
# ---------------------------------------------------------------------------
CONFIG_FIREFLY_NETWORK=y

# Required for setsockopt(SO_RCVTIMEO) to actually bound the echo-reply wait
# in srvNetwork.cpp's modem_send() (CONFIG_FIREFLY_NETWORK_SEND_SETTLE_MS) -
# without it, Zephyr's socket layer silently treats SO_RCVTIMEO as a no-op
# and recv() blocks forever if the destination never replies.
CONFIG_NET_CONTEXT_RCVTIMEO=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# Network management (drives the L4-connected event srvNetwork waits on)
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y

# Modem transport. The EG800Z has no AT+CMUX at all - the command does not
# appear anywhere in the EG800Z&EG915Z Series (UniRTOS) AT Commands Manual
# V1.0 - and drivers/modem/modem_cellular.c is CMUX-only, so MODEM_CELLULAR
# cannot drive this module. FIREFLY_NETWORK_TRANSPORT_EG800Z_PPP selects
# modemEg800zPpp.cpp instead, which runs the PPP Application Note V1.1
# sequence over modem_chat/modem_ppp directly and selects MODEM_MODULES,
# MODEM_CHAT, MODEM_PPP and MODEM_BACKEND_UART for itself.
CONFIG_FIREFLY_NETWORK_TRANSPORT_EG800Z_PPP=y
CONFIG_FIREFLY_NETWORK_APN="gsfleet.cxn"

# Same UDP echo endpoint and payload the raw-AT round above uses, so both
# modes on this board can be compared against the same server. Without
# these three, FIREFLY_NETWORK falls back to its Kconfig defaults
# (8.8.8.8:4242, "hello from firefly") and there is nothing listening to
# echo the datagram back. The port matches FIREFLY_MODEM_TEST_SERVER_PORT's
# own default, which the raw-AT block above leaves untouched.
# Back to the Kconfig default of 120s. This was briefly raised to 240s to
# let modem_cellular's retry path have several attempts inside one round,
# but that reasoning does not hold: the driver's recovery (RESET_N pulse,
# then PWRKEY) cannot fix a modem that rejects a command outright, so the
# extra 120s only lengthens the stare at "waiting for
# NET_EVENT_L4_CONNECTED" without changing the outcome. The wait itself is
# correct - g_l4_event is cleared at the top of modem_connect() and posted
# from the NET_EVENT_L4_CONNECTED handler - so a long hang here means the
# modem never got to PPP, not that the wait is broken.
CONFIG_FIREFLY_NETWORK_CONNECT_TIMEOUT_S=120

CONFIG_FIREFLY_NETWORK_DEST_IP="172.188.83.251"
CONFIG_FIREFLY_NETWORK_DEST_PORT=49167
CONFIG_FIREFLY_NETWORK_MESSAGE="test,message,GSFleet,0123456789"

# AT command channel over CMUX's second DLCI, available at the same time as
# the PPP data channel on the first - this is what makes AT commands and PPP
# usable simultaneously, and it is CMUX doing that, not extra app code.
CONFIG_SHELL=y
CONFIG_NET_SHELL=y

# MODEM_AT_SHELL is "depends on !SHELL_WILDCARD" (drivers/modem/
# Kconfig.at_shell), and SHELL_WILDCARD defaults to y as soon as SHELL is
# enabled. Without turning it off, MODEM_AT_SHELL above is silently
# dropped by Kconfig - no error, no warning, just no `at` command at
# runtime - which defeats the whole point of the CMUX AT channel described
# above. Losing shell wildcards (`log enable dbg net*`) is the trade.

# UART async API buffer sizes / CMUX tuning. RTS/CTS are wired to the
# EG800Z, and hw-flow-control is set on uart21 in the board overlay - the
# driver's init script sends AT+IFC=2,2 to match.
# Selects modem_backend_uart_async_hwfc.c over the plain async backend -
# the RTS/CTS-aware receive path. uart21 has hw-flow-control set in the
# board overlay and the driver's init script sends AT+IFC=2,2, so this is
# the backend that matches the wiring; nrf93m1dk_nrf54l15_cpuapp.conf
# enables it for the same reason.
CONFIG_MODEM_BACKEND_UART_ASYNC_HWFC=y
CONFIG_MODEM_BACKEND_UART_ASYNC_RECEIVE_IDLE_TIMEOUT_MS=1

# Full modem debug logging while bringing the link up. At _INF (what this
# was) modem_chat reports only "timed out"/"aborted" with no indication of
# which AT command produced it - the dead end the first network-mode run on
# real hardware hit. _DBG on MODEM_MODULES adds modem_chat's sent/received
# AT bytes, i.e. the transcript needed to tell "modem never answered" from
# "modem answered ERROR to command N". nrf93m1dk_nrf54l15_cpuapp.conf runs
# at _DBG for the same reason. Drop back to _INF once the link is stable.
# MODEM_MODULES_LOG_LEVEL covers modem_chat's sent/received AT transcript,
# which is the whole diagnostic value here. MODEM_LOG_LEVEL is gone with
# drivers/modem: nothing from that directory is built in this path.
CONFIG_MODEM_MODULES_LOG_LEVEL_DBG=y

# The _DBG AT transcript does not fit the base board conf's 4096-byte log
# buffer - deferred logging drops messages once its queue is full, silently
# losing exactly the lines being hunted for.
CONFIG_LOG_BUFFER_SIZE=16384

# SHELL_LOG_BACKEND defaults to y whenever SHELL is enabled, and the base
# board conf enables LOG_BACKEND_UART unconditionally. Both write the same
# console UART, so with CONFIG_SHELL=y above, every log line is emitted
# twice with a "uart:~$" prompt redrawn between the copies - which is what
# makes a captured network-mode log nearly unreadable. Turning the
# standalone UART backend off leaves the shell's own log backend as the
# single console writer.
CONFIG_LOG_BACKEND_UART=n

# ---------------------------------------------------------------------------
#  Shared by both modes above
# ---------------------------------------------------------------------------
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_USE_DEDICATED_WQ=y

# Async/EasyDMA UART, used by both modes above - the raw-AT test's own
# uart_rx_enable()/callback and the Zephyr cellular driver's UART backend
# both require it. Safe without the nRF54L/H "reliable reception without
# HWFC" TIMER workaround (see boards/eg800z.overlay's top comment) now that
# uart21 has real RTS/CTS and hw-flow-control set.
CONFIG_UART_ASYNC_API=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_RING_BUFFER=y

# This toolchain's default libc (picolibc) builds its printf without
# floating-point conversion support unless asked for - without this,
# every %f/%.4f in srvModemTest_eg800z.cpp's (and srvModemTest_nrf93m1's)
# printk() calls prints the literal text "*float*" instead of the value,
# rather than erroring or truncating.
CONFIG_PICOLIBC_IO_FLOAT=y
