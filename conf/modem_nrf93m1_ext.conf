# SPDX-License-Identifier: Apache-2.0
#
# srvNetwork: nRF93M1 modem wired externally to nrf54lm20dk over uart30
# (PPP, CMUX-multiplexed with AT). Pair with boards/nrf93m1_ext.overlay.
#
# Settings below mirror nRF Connect SDK's own nrf93m1dk/ppp_shell sample
# (same modem, same driver, same CMUX/PPP stack) - just pointed at this
# board's own free UART instead of the nRF93M1 DK's on-board wiring. If
# the nRF93M1 is instead the on-board modem on the nrf93m1dk board, use
# TARGET=nrf93m1dk (see the outer firefly repo's 31_build.sh) - that board
# has its own boards/nrf93m1dk_nrf54l15_cpuapp.conf and needs neither this
# fragment nor boards/nrf93m1_ext.overlay.
CONFIG_FIREFLY_NETWORK=y

# Required for setsockopt(SO_RCVTIMEO) to actually bound the echo-reply wait
# in srvNetwork.cpp's modem_send() (CONFIG_FIREFLY_NETWORK_SEND_SETTLE_MS) -
# without it, Zephyr's socket layer silently treats SO_RCVTIMEO as a no-op
# and recv() blocks forever if the destination never replies.
CONFIG_NET_CONTEXT_RCVTIMEO=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_PPP=y
# Cuts net_if_down(PPP)'s worst-case wait for an LCP Terminate-Ack from 9s to
# 1s - see conf/modem_le270.conf's copy of this comment for the full
# explanation. Applied here too for consistency since net_if_down()/ppp_l2.c
# are shared code, even though this target hasn't shown the same stall.
CONFIG_NET_L2_PPP_TIMEOUT=1000
CONFIG_NET_L2_PPP_MAX_TERMINATE_REQ_RETRANSMITS=0
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# Network management (drives the L4-connected event srvNetwork waits on)
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y

# Modem driver
CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y

# Same SIM/carrier as the nRF93M1 DK - MODEM_CELLULAR_APN defaults to
# "internet" if left unset, which this carrier rejects.
CONFIG_MODEM_CELLULAR_APN="gsfleet.cxn"

CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_USE_DEDICATED_WQ=y

# AT command channel over CMUX's second DLCI, available at the same time as
# the PPP data channel on the first - this is what makes AT commands and PPP
# usable simultaneously, and it is CMUX doing that, not extra app code.
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_MODEM_AT_SHELL=y
CONFIG_MODEM_AT_USER_PIPE_IDX=0
CONFIG_MODEM_AT_SHELL_CHAT_RECEIVE_BUF_SIZE=256

# UART async API + buffer sizes, matching Nordic's own tuning for this modem
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_ASYNC_API=y
CONFIG_SHELL_BACKEND_SERIAL_API_ASYNC=y
CONFIG_MODEM_BACKEND_UART_ASYNC_HWFC=y
CONFIG_MODEM_BACKEND_UART_ASYNC_RECEIVE_IDLE_TIMEOUT_MS=1
CONFIG_MODEM_CMUX_MTU=127
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE_EXTRA=532
CONFIG_MODEM_CELLULAR_UART_BUFFER_SIZES=532
CONFIG_MODEM_CMUX_MSC_FC_THRESHOLD=32
CONFIG_MODEM_CELLULAR_USER_PIPE_BUFFER_SIZES=1024

CONFIG_MODEM_CMUX_LOG_LEVEL_INF=y
CONFIG_MODEM_MODULES_LOG_LEVEL_INF=y
