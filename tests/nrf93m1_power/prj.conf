#
# Settings common to both scenarios in testcase.yaml; each scenario's
# extra_configs then selects PPP (srvNetwork) or raw-AT
# (srvModemTest_nrf93m1) on top of this.
CONFIG_ZTEST=y

CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=32

# Lets the test read srvModemTest_nrf93m1_modem_is_powered() (see
# srvModemTest_nrf93m1.h) to assert "not powered" without any real UART/AT
# traffic. Does not affect the PPP scenario - it uses Zephyr's own
# pm_device_state_get() instead - and does not install a fake port: both
# scenarios exercise the real hardware port.
CONFIG_FIREFLY_TEST_HOOKS=y

CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_USE_DEDICATED_WQ=y

# Raw-AT mode uses these directly (uart_configure/uart_rx_enable/
# uart_callback_set, a manual ring buffer, float-formatted printk in its
# phase report); PPP mode's modem backend also needs the async UART API
# underneath it.
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_ASYNC_API=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_RING_BUFFER=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBC=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_ASSERT=y
