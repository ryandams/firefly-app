# SPDX-License-Identifier: Apache-2.0
CONFIG_ZTEST=y

CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=32
# test_srvModemTest.cpp attaches the modem test services' subscribers to
# bus_chan only for its own suite - see the comment at its top.
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

# native_sim doesn't enable GPIO by default; boards/native_sim.overlay
# supplies led0..led3 on the emulated controller that comes with it.
CONFIG_GPIO=y

# Neither does it enable INPUT; boards/native_sim.overlay's button0..3
# need it for myButtonListener.
CONFIG_INPUT=y

CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBC=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_FIREFLY_TEST_HOOKS=y

# Real hardware needs this wait so disconnect() doesn't race ahead of the
# CMUX transmit queue; the fake port here completes send() synchronously,
# so there's nothing to wait for and it would only slow the test suite down.
CONFIG_FIREFLY_NETWORK_SEND_SETTLE_MS=0
CONFIG_ASSERT=y
CONFIG_TEST_RANDOM_GENERATOR=y
