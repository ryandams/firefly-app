#
# Settings common to the scenario in testcase.yaml.
CONFIG_ZTEST=y

CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=32

# Lets the test read srvModemTest_eg800z_modem_is_powered() (see
# srvModemTest_eg800z.h) to assert "not powered" without any real UART/AT
# traffic. Does not install a fake port - the scenario exercises the real
# hardware port.
CONFIG_FIREFLY_TEST_HOOKS=y

CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_USE_DEDICATED_WQ=y

# srvModemTest_eg800z uses uart_configure/uart_rx_enable/uart_callback_set,
# a manual ring buffer, and float-formatted printk in its phase report.
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_ASYNC_API=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_RING_BUFFER=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBC=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_ASSERT=y
