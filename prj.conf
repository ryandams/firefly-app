# SPDX-License-Identifier: Apache-2.0
# Common configuration - board-specific bits live in boards/*.conf

# --- C++ (requirement 1) ---------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBC=y

# --- messaging / state machine --------------------------------------------
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=16

# --- buttons (myButtonListener) --------------------------------------------
# Neither board enables this by default, unlike GPIO which the DK's own
# defconfig already turns on - so this lives here, not in boards/*.conf.
CONFIG_INPUT=y

CONFIG_EVENTS=y
CONFIG_REBOOT=y

# --- logging ---------------------------------------------------------------
CONFIG_LOG=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
