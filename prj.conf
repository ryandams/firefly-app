# SPDX-License-Identifier: Apache-2.0
# Common configuration - board-specific bits live in boards/*.conf

# --- C++ (requirement 1) ---------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBC=y

# --- messaging / state machine --------------------------------------------
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_SMF=y

CONFIG_EVENTS=y
CONFIG_REBOOT=y

# --- logging ---------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_ASSERT=y
