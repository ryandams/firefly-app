patches:
  - path: zephyr/quectel-eg800z-driver.patch
    sha256sum: 1a4ba919239b85eaa2e1b2c0d62b921cad492d14085e385715bf849ce3c6d940
    module: zephyr
    author: firefly
    email: Ryan.damsgaard@gsfleet.io
    date: 2026-08-20
    upstreamable: true
    comments: |
      Adds a Zephyr modem_cellular vendor driver for the Quectel EG800Z
      (cellular_quectel_eg800z.c + quectel,eg800z.yaml devicetree binding),
      modeled on the existing cellular_quectel_eg800q.c driver plus the
      EG800Z's own documented PWRKEY/RESET/AT+QPOWD/AT+QSCLK timing and
      commands. Wires the new driver into
      drivers/modem/vendor_modem_cellular/CMakeLists.txt and adds
      DT_HAS_QUECTEL_EG800Z_ENABLED to Kconfig.cellular's CMUX-MTU-127
      select list alongside the other 127-byte-DLCI modems.
  - path: zephyr/modem-cellular-power-off-pulse.patch
    sha256sum: 368beb59a4db6f12a09c014ad122321d6c5503176cb9a7c7a2a57aa193709002
    module: zephyr
    author: firefly
    email: Ryan.damsgaard@gsfleet.io
    date: 2026-09-30
    upstreamable: true
    comments: |
      Adds struct modem_cellular_vendor_config::power_off_pulse_duration_ms,
      used by modem_cellular_on_power_off_pulse_state_enter() when non-zero
      instead of the existing power_pulse_duration_ms (which stays the
      fallback, so every other vendor driver is unaffected - they all leave
      the new field at its zero default). Some modems document meaningfully
      different minimum PWRKEY pulse widths for power-on vs power-off (the
      Fibocom LE270: >=650ms on, >=3.1s off) that a single shared duration
      can't satisfy without either an unnecessarily long power-on pulse or a
      too-short, unreliable power-off one - see
      cellular_fibocom_le270.c's use of the new field in
      fibocom-le270-driver.patch.

      2026-10-06 update (Change 5, LE270_driver_optimisation_instructions.md):
      added a second field the same way, shutdown_cmux_settle_ms, used by
      modem_cellular_init_power_off_event_handler()'s
      MODEM_CELLULAR_EVENT_CMUX_DISCONNECTED case when non-zero instead of
      the existing reset_pulse_duration_ms (fallback unchanged, so every
      other vendor driver is still unaffected). Real LE270 hardware logs
      showed a ~200ms fixed gap between "CMUX disconnected" and
      AT+CPWROFF being sent, reusing reset_pulse_duration_ms for that
      settle - but that field is tied to a vendor's documented RESET_N
      pulse width (LE270: >=100ms per its Hardware Guide), which has no
      real relation to how long the UART needs after CMUX teardown before
      it reliably accepts un-multiplexed AT commands again. Split out
      rather than just shrinking reset_pulse_duration_ms itself, so this
      driver's unrelated AWAIT_PPP_DEAD recovery-path timing (see
      modem-cellular-suspend-during-ppp-dead.patch) stays exactly as
      documented and hardware-verified. See fibocom-le270-driver.patch's
      own changelog for the LE270-side value chosen and verification
      status.
  - path: zephyr/modem-cellular-suspend-during-ppp-dead.patch
    sha256sum: 92ae88ad3bd10ee5b1dc4489009b0d00c32dfd281718a04c4d12602f6524fdbb
    module: zephyr
    author: firefly
    email: Ryan.damsgaard@gsfleet.io
    date: 2026-10-06
    upstreamable: true
    comments: |
      Adds a missing MODEM_CELLULAR_EVENT_SUSPEND case to
      modem_cellular_await_ppp_dead_event_handler() (AWAIT_PPP_DEAD state),
      transitioning to MODEM_CELLULAR_STATE_INIT_POWER_OFF like every other
      state in this file already does on SUSPEND. No manual cleanup needed
      in the new case: modem_cellular_enter_state() always calls the
      current state's own _leave() function first, and
      modem_cellular_on_await_ppp_dead_state_leave() already does exactly
      the net_if_carrier_off/modem_chat_release/modem_ppp_release cleanup
      this needs - verified by reading modem_cellular_enter_state()'s
      implementation directly, not assumed.

      Found 2026-10-06 while debugging a real-hardware finding on the
      LE270 target (see fibocom-le270-driver.patch's own changelog):
      several minutes of automatic redial attempts occurring AFTER
      srvNetwork had already reported a round as successfully finished,
      eventually exhausting MODEM_CELLULAR_MAX_SCRIPT_FAILURES and ending
      in a shutdown-script timeout with the modem rebooting mid-sequence.
      Root cause: an application's own net_if_down() call legitimately
      drives Zephyr's PPP L2 through its own "dead" phase as a normal part
      of terminating the link (LCP termination), firing
      NET_EVENT_PPP_PHASE_DEAD - if this self-inflicted event is processed
      while net_if_is_admin_up() still reads true (net_if_down() hasn't
      finished clearing that flag yet), modem_cellular_registered_event
      _handler() legitimately transitions to AWAIT_PPP_DEAD, exactly as it
      would for a genuine unexpected network-side PPP drop. A
      pm_device_runtime_put() suspend request arriving during the
      resulting ~200ms (reset_pulse_duration_ms) settle window was
      silently dropped by AWAIT_PPP_DEAD's default case - this driver had
      no way to distinguish "the application wants to shut down" from "the
      network dropped us, try to reconnect" once in this state. Once the
      settle timer fired, the driver proceeded into its own unsolicited-
      PPP-death recovery path (TIMEOUT -> RUN_DIAL_SCRIPT, retrying up to
      MODEM_CELLULAR_MAX_SCRIPT_FAILURES=3 times, each attempt able to
      consume the full per-script timeout if the modem doesn't respond),
      completely unaware the application had already moved on.

      This likely also explains an earlier LE270 finding tracked
      separately and not actioned at the time: net_if_down(PPP) itself
      stalling for several seconds before returning on some rounds -
      probably the same race, resolving on its own that time instead of
      escalating into a full redial-then-give-up cycle.

      Not LE270-specific: this is a genuine gap in the shared
      AWAIT_PPP_DEAD state handling, affecting any vendor driver using
      this framework without a .network script (the only architecture
      where AWAIT_PPP_DEAD's own TIMEOUT handler unconditionally redials).
      Not yet verified on hardware - the fix is designed to be small and
      self-contained (one missing switch case, relying on an already-
      proven cleanup path) specifically so it can be verified in isolation
      before any further optimization-pass changes continue.
  - path: zephyr/fibocom-le270-driver.patch
    sha256sum: 3eb1b6639d66a18f1e377e64c6bf0d40cd13752e2312f2bdfbc733a4bdf92b05
    module: zephyr
    author: firefly
    email: Ryan.damsgaard@gsfleet.io
    date: 2026-09-30
    upstreamable: true
    comments: |
      Adds a Zephyr modem_cellular vendor driver for the Fibocom LE270
      (cellular_fibocom_le270.c + fibocom,le270.yaml devicetree binding),
      modeled on the existing cellular_quectel_eg800q.c driver. Unlike the
      EG800Z, the LE270 documents AT+CMUX support (AT Commands User Manual
      V1.6 section 4.16, up to 3 channels) and standard 3GPP PPP dial-up
      (ATD*99***1#/AT+CGDATA), so it uses the plain CMUX+PPP chat scripts
      rather than a custom no-CMUX transport; only one CMUX user pipe is
      wired up to stay inside the documented 3-channel limit. Power/reset
      timing (power_pulse_duration_ms=3100, reset_pulse_duration_ms=200)
      comes from the LE270 Hardware Guide V2.2 sections 4.2/4.3. Wires the
      new driver into drivers/modem/vendor_modem_cellular/CMakeLists.txt and
      adds DT_HAS_FIBOCOM_LE270_ENABLED to Kconfig.cellular's CMUX-MTU-127
      select list alongside the other 127-byte-DLCI modems.

      2026-09-30 update (first real-hardware test): AT+CMEE=1 in the init
      script got a plain ERROR from the module right after AT+CFUN=4
      (203ms round-trip vs ~6ms for the preceding query - suspected CFUN
      state-transition timing quirk), and modem_cellular's abort_matches
      treats any ERROR as fatal for the whole init script, so CMUX/PPP
      never started. Removed AT+CMEE=1 (a diagnostic nicety only - does not
      affect error *detection*, just verbose vs terse error codes) and
      added a 300ms settle delay after AT+CFUN=4. Also removed AT+CIMI
      (manual: the only one of the five identity queries requiring
      RequireSIMCardNormal=Yes, same abort risk if the SIM isn't ready yet;
      nothing reads CELLULAR_MODEM_INFO_SIM_IMSI). Raised the dial script
      timeout 10s->90s and periodic script timeout 4s->15s: both are a
      single whole-script watchdog (confirmed against modem_chat.c, not
      per-step), and the manual's own documented MaxResponseDuration
      figures for AT+CGACT/AT+CFUN=1/AT+CEREG?/AT+CSQ already summed past
      the old budgets on paper.

      2026-09-30 update (second real-hardware test): the init script now got
      past AT+CGMR and hit a new abort at the very last step, AT+CMUX=0,0,5,127
      -> ERROR in ~5.4ms (same fast, clean-rejection signature as the
      AT+CMEE=1/AT+CIMI aborts above). Three independent investigations
      re-read AT Commands User Manual V1.6 section 4.16 (pp.53-56) and
      converged on the same finding: the manual's Description states "if the
      parameters are left out, the default value is used", and its only
      worked SET example is the 3-parameter "AT+CMUX=0,0,1 -> OK" - a
      4-parameter invocation (mode,subset,port_speed,N1) is never actually
      demonstrated. Dropped N1 from the init script's AT+CMUX command
      (now "AT+CMUX=0,0,5", keeping port_speed=5/115200 baud, letting N1
      default to 31 per the manual's own READ example
      "+CMUX: 0,0,5,31,10,3,30,10,2"); this only affects the on-the-wire CMUX
      frame size, not Kconfig.cellular's MODEM_CMUX_DEFAULT_MTU_127 which
      sizes Zephyr's own local CMUX buffers independently. Also reduced
      startup_time_ms 15000ms->2000ms: the real hardware log shows the
      init script's first "AT" already getting a clean OK in ~4.5ms once
      RUN_INIT_SCRIPT begins, so the old value was an untested placeholder
      far larger than needed; 2000ms keeps several orders of magnitude of
      margin above the one observed sample.

      Caveat surfaced by an adversarial review of the above: the sibling
      cellular_quectel_eg800z.c driver hit this exact fast-clean-ERROR
      signature on this exact command, and its real root cause was "AT+CMUX
      does not exist on that firmware at all" - not a parameter problem.
      Unlike the EG800Z, the LE270's manual fully documents AT+CMUX (a
      parameter table, a read form, and a query form), so that worst case
      is less likely here, but it isn't ruled out - this is a different
      firmware build (12007.7000.00.04.37.03) than whatever the manual was
      written against, and this exact firmware already disagreed with its
      own manual twice (AT+CMEE=1, AT+CIMI). Added a diagnostic-only
      AT+CMUX=? query immediately before the real AT+CMUX=0,0,5 command:
      always side-effect-free per the manual, and its response settles
      which story is true on the very next hardware run without another
      guess - a normal "+CMUX: (...)" answer means the module claims
      support and the parameter shape needs more work; an ERROR there means
      this modem needs the same non-CMUX architectural path
      modemEg800zPpp.cpp already uses for the EG800Z.

      2026-09-30 update (power pulse split + AT shell): switched
      power_pulse_duration_ms to 700ms (power-on only, ~50ms margin above
      the documented 650ms minimum) and added
      power_off_pulse_duration_ms=3100 (see
      zephyr/modem-cellular-power-off-pulse.patch) now that the framework
      supports both independently - previously both directions shared the
      3100ms power-off value, needlessly extending how long the UART pipe
      stays unattached during every power-on (see the AWAIT_POWER_ON/
      startup_time_ms comment in the driver for why that window matters).

      2026-10-01 update (third real-hardware test): AT+CMUX=? (the pure
      capability query, not just the setting command) now also fails with
      the same fast, clean ERROR - a query can't be "out of order" with
      anything, since it changes no state, which rules out a CFUN/sequencing
      explanation on its own. Still, since this exact firmware has already
      diverged from its own manual multiple times, removed the forced
      AT+CFUN=4 ("flight mode") step as a live experiment rather than
      assuming the manual's "no prerequisite" claim holds here too: the
      module's own AT+CFUN? already shows it boots in CFUN=1 (full
      functionality) by default, and forcing CFUN=4 measured a real 203ms
      cost on real hardware, so this both tests the CFUN hypothesis and
      removes dead weight either way. Also added a non-fatal AT+CMEE=2
      (MODEM_CHAT_SCRIPT_CMD_RESP_MULT with allow_match, not ok_match - the
      =1 form of this exact command is what caused the original abort this
      driver is built around) early in the init script, so that any future
      ERROR - AT+CMUX in particular - hopefully reports a detailed +CME
      ERROR reason instead of a bare ERROR.

      2026-10-01 update (fourth real-hardware test): CFUN state is now ruled
      out conclusively - with AT+CFUN=4 removed, this run's AT+CEREG? showed
      "+CEREG: 1,5" (registered, roaming) while still in the module's
      default CFUN=1, and AT+CMUX=? still failed with the identical clean
      ERROR regardless. AT+CMEE=2 (added last update) also failed the same
      way. That makes five different documented-as-valid commands
      (AT+CMEE=1, AT+CMEE=2, AT+CIMI, AT+CMUX 4-param, AT+CMUX query) all
      rejected identically by this firmware, across every state tried -
      strong evidence this firmware build simply does not implement
      AT+CMUX, same as the sibling EG800Z. One gap remained: every run so
      far aborted on AT+CMUX=? before ever reaching the actual
      AT+CMUX=0,0,5 setting command, so there was still no direct evidence
      on that exact form specifically. Made both CMUX lines temporarily
      allow_match instead of ok_match for one more diagnostic run, to let
      the script complete and surface that one remaining data point either
      way.

      2026-10-02 update (resolved): the evidence above was sent to a
      Fibocom FAE, who provided updated firmware. AT+CMUX=? and
      AT+CMUX=0,0,5 both immediately returned OK, CMUX connected (SABM/UA
      on channel 0), and DLCI 1/2/3 all opened successfully -
      AT+CGDCONT/APN setup then succeeded too. Reverted every diagnostic
      added while chasing this on the old firmware, now that it's no
      longer needed: restored AT+CFUN=4 (the module's own default CFUN=1
      was only ever used to test a hypothesis, now ruled out) and its
      300ms settle delay, removed AT+CMEE=2 entirely, and restored
      AT+CMUX to its original full 4-parameter form (AT+CMUX=0,0,5,127,
      N1=127 matching MODEM_CMUX_DEFAULT_MTU_127) with a hard ok_match -
      now that this firmware actually implements it, a failure here
      should abort loudly again, not be silently tolerated.

      Removing AT+CMEE=2 also fixed a real, separate problem it was
      causing: with CMEE=2 active, the module reports failures as
      "+CME ERROR: <reason>" instead of a bare "ERROR" - a format none of
      modem_cellular's match tables (abort_matches, allow_match,
      dial_abort_matches) recognize, since they only match on a literal
      "ERROR" prefix. This meant the dial script's own expected-to-fail
      AT+CGACT=0,1 step (deactivate context 1 before dialing - this
      network answers "+CME ERROR: ue busy" or "+CME ERROR: Last PDN
      disconnection not allowed", never OK) stopped being recognized as
      either success or failure, so the script just sat until its own 90s
      timeout instead of moving on to AT+CFUN=1/ATD*99***1# the way
      allow_match is supposed to let it. AT+CMEE now stays at the module's
      default (0, plain ERROR) for exactly this reason - see the comment
      in the driver's init script.

      2026-10-02 update (fifth real-hardware test, new firmware): with
      AT+CMEE reverted, the dial script got all the way to ATD*99***1# ->
      CONNECT and PPP frames started flowing - real progress - but the
      round still failed. Root cause: this module broadcasts every
      +CEREG: unsolicited URC identically on all three open CMUX DLCIs at
      once (confirmed in raw frame captures - the same bytes arrive on
      ch:1, ch:2, and ch:3 within milliseconds), not just the DLCI the AT
      session is attached to. Right as modem_cellular.c's
      RUN_DIAL_SCRIPT success handler hands DLCI2 over to PPP, this
      duplicated-URC flood races the handover: a stale "+CEREG: 2"
      (searching) sample processed after a "+CEREG: 5" (registered) one
      flips modem_cellular_is_registered() to false, firing
      MODEM_CELLULAR_EVENT_DEREGISTERED - and since this driver has no
      separate .network script, the state machine goes AWAIT_PPP_DEAD ->
      (after reset_pulse_duration_ms, 200ms - matches the real-hardware
      gap exactly) -> back to RUN_DIAL_SCRIPT, reattaching the AT chat
      parser to DLCI2 while PPP is still actively using it for data. PPP's
      own LCP retransmissions then get fed into modem_chat as garbage
      ("receive buffer overrun", repeating) until the dial script times
      out, retries, and srvNetwork's own 120s timeout ends the round -
      traced end-to-end from the real hardware log.

      Fix: removed AT+CEREG=1 (enabling unsolicited registration URCs)
      from the init script, leaving AT+CEREG? (a one-time direct read)
      alone. Registration tracking still works - modem_cellular's periodic
      script (AT+CEREG?/AT+CSQ, every CONFIG_MODEM_CELLULAR_PERIODIC_SCRIPT_MS
      = 2000ms) polls it directly once in AWAIT_REGISTERED/REGISTERED, and
      a queried response, unlike an unsolicited URC, only ever comes back
      on the one channel that asked - it doesn't suffer the duplication.
      The only cost is detecting a registration change within ~2s instead
      of instantly.

      CONFIRMED 2026-10-02 (next hardware test, same fix): first fully
      successful end-to-end round. CMUX/DLCI/APN/dial/PPP/IPCP all
      succeeded, NET_EVENT_L4_CONNECTED, sendto() returned success,
      NETTRACE SUMMARY result=0. LE270 integration functionally complete.

      2026-10-05 update (charge/timing optimization pass): the user ran 3
      back-to-back hardware tests on this working firmware with a
      Joulescope JS110 correlated against the firmware log (written up in
      Modem_comparison_nRF93M1_vs_LE270.docx, compared against 3 nRF93M1
      tests) specifically to find where time/charge were being wasted.
      Findings and fixes, all confirmed by reading modem_cellular.c's
      actual state-machine logic (not just inferred from the report):

      1) AT+CFUN=4 in the init script was cancelling a network attach the
      module starts by itself ~1.6s after power-on (it boots in CFUN=1),
      wasting ~40mC on the aborted attempt, then paying for a second full
      attach once AT+CFUN=1 was sent again in the dial script. Removed
      AT+CFUN=4 (init) and AT+CFUN=1 (dial) entirely - the module simply
      stays in CFUN=1 throughout, and its one-and-only attach runs in the
      background while CMUX/APN are being configured. AT+CFUN? is kept in
      the init script as a read-only diagnostic.

      2) The driver wasted a fixed, unconditional 2.000s between CONNECT
      and the start of PPP traffic, confirmed by reading
      modem_cellular_on_run_dial_script_state_enter/_event_handler and
      modem_cellular_on_await_registered_state_enter: PPP is attached and
      net_if_carrier_on() fires immediately on CONNECT regardless of
      registration state, but the net_if stays dormant (no LCP/IPCP) until
      MODEM_CELLULAR_EVENT_REGISTERED fires and REGISTERED's
      net_if_dormant_off() runs - gated entirely by
      modem_cellular_is_registered()'s cached registration_status, which
      with AT+CFUN=4 removed above was last set by the init script's own
      AT+CEREG? sent early, before CMUX/APN, likely before the attach had
      finished - so it read NOT_REGISTERED at dial time regardless, forcing
      a wait for the first periodic-script tick
      (CONFIG_MODEM_CELLULAR_PERIODIC_SCRIPT_MS, 2000ms) to refresh it.
      Fixed by replacing the dial script's old AT+CFUN=1 + fixed 500ms "AT"
      settle (now unnecessary per point 1) with a real AT+CEREG? query
      immediately before ATD*99***1# - this refreshes the registration
      cache right before it matters, so a successful dial after an
      already-complete attach now transitions straight to REGISTERED
      instead of idling for a full periodic interval. Also addresses the
      report's separately-flagged "fixed 0.5s wait before ATD" finding with
      the same single change.

      3) The driver waited a fixed ~13.1s after CMUX teardown before
      declaring the modem off (power_off_pulse_duration_ms 3100ms + the old
      shutdown_time_ms 10000ms), even though the Joulescope trace showed
      modem current already at 0 roughly 2.6-2.7s after PPP went down -
      confirmed by reading modem_cellular_run_shutdown_script_event_handler
      and modem_cellular_on_init_power_off_state_enter: with no .shutdown
      script configured, INIT_POWER_OFF falls straight to the blind
      power-off pulse + shutdown_time_ms wait, with no way to end early.
      Added a .shutdown script (AT+CPWROFF per Hardware Guide V2.2 sec 4.2,
      the module's documented software power-off command, plus a 3000ms
      settle since CPWROFF has no completion URC to wait on instead) -
      defining .shutdown makes a successful shutdown script go straight to
      IDLE, skipping the pulse and shutdown_time_ms entirely (same codepath
      the EG800Z's AT+QPOWD already relies on). If AT+CPWROFF ever errors,
      the framework automatically falls back to the original power-pulse
      path, so this has no downside beyond the AT+CPWROFF round-trip
      itself. shutdown_time_ms was also dropped 10000ms->2000ms as a
      smaller safety margin for that now-rare fallback path only.

      4) startup_time_ms (the fixed wait after the PWRKEY power-on pulse
      before the init script starts) was dropped 2000ms->1200ms: all 3
      hardware tests independently showed "AT command ready" at 1.06s and
      "+SIM READY" at 1.43s (measured from power-on), well inside even the
      reduced 1.9s total boot window (700ms pulse + 1200ms startup_time_ms).

      All four changes are software-only (no devicetree/wiring changes),
      verified by a clean ./33_build.sh -p rebuild. Not yet verified on
      real hardware - that's the next test the user will run. Each change
      above was deliberately designed to fail safe: an unexpectedly slow
      attach just falls through to the exact same behavior as before
      (periodic-script wait), and an AT+CPWROFF error falls back to the
      original power-pulse shutdown path automatically.

      CONFIRMED 2026-10-02 (same change, next hardware test): first fully
      successful end-to-end round (CMUX/APN/dial/PPP/IPCP/UDP send all
      succeeded, NETTRACE SUMMARY result=0). LE270 integration functionally
      complete.

      2026-10-05 (first optimization pass, commit 3c61afa): the user ran a
      3-test Joulescope/log comparison against the nRF93M1
      (Modem_comparison_nRF93M1_vs_LE270.docx) and found most of the LE270's
      charge/time penalty was driver flow, not the modem. Fixed: removed
      AT+CFUN=4 (init) and AT+CFUN=1 (dial) - the module attaches on its own
      in its default CFUN=1, and forcing flight mode mid-boot was cancelling
      that attach and paying for a second one; replaced the dial script's
      AT+CFUN=1 + fixed 500ms settle with a real AT+CEREG? query right
      before ATD (refreshes modem_cellular_is_registered()'s cache right
      when AWAIT_REGISTERED's entry check needs it, instead of leaving it
      stale until the first 2000ms periodic tick); added a .shutdown script
      (AT+CPWROFF + a settle delay) so a successful shutdown skips the
      3100ms power pulse + old 10000ms shutdown_time_ms wait entirely;
      dropped startup_time_ms 2000ms->1200ms per 3 consistent "AT command
      ready"/"+SIM READY" hardware samples. Confirmed on hardware the same
      day: first full round completed in ~20.7s/~50µAh (down from the
      un-optimized baseline), full details in the memory notes for this
      session.

      Same-day attempt to move this file out of the Zephyr tree entirely
      (into firefly-app's own drivers/modem/, commit bc6d3b9) was reverted
      (commit 9d07482 in firefly-app) after real hardware testing showed it
      hung on boot with zero serial output, despite the move passing every
      static check available (clean build/link, correct Kconfig resolution,
      and an nm --print-size symbol-table diff against the last known-good
      build showing zero differences across 3518 symbols). A hardware A/B
      test - flashing the pre-move commit's separately-built hex - proved
      the move itself was the cause. Root cause not pinned down (most likely
      a link-layout-order sensitivity, e.g. Zephyr's same-priority
      device-init ordering being link-order-dependent, or this board's
      MPU stack-guard alignment being layout-sensitive) since restoring
      working hardware took priority over further bisection. This file
      stays as a Zephyr-tree patch for that reason - see the firefly-app
      project memory (project_modem_consolidation.md) for the full
      diagnosis writeup before attempting this move again.

      2026-10-05 (second optimization pass, diagnosis step only):
      LE270_driver_optimisation_instructions.md (written by the user's
      hardware colleague after a second, more detailed Joulescope
      comparison against the first optimization pass above) identified
      ATD->CONNECT taking 1.41s instead of 0.21s as the largest remaining
      cost, theorizing the boot-time attach isn't bringing up a default
      bearer for the configured APN on CID 1. Per that document's own
      process (diagnose before changing behavior; one change at a time,
      hardware-verified before the next), added TEMPORARY, non-fatal
      (allow_match) diagnostic reads - AT+CGDCONT?, AT+CGACT?,
      AT+CGPADDR=1, all confirmed documented against AT Commands User
      Manual V1.6 for this firmware (AT+CGCONTRDP, also suggested, is NOT
      documented in this manual and was skipped per the document's own
      "if the manual supports it" condition) - at two points: end of the
      init script (still plain/non-CMUX AT, after the boot-time attach but
      before the framework's own generic APN script ever runs
      AT+CGDCONT=1,"IP","gsfleet.cxn") and the start of the dial script
      (right after that APN script has run). Comparing the two should show
      whether CID 1 was already active/addressed before this round touched
      it, and whether writing CGDCONT disturbed it - the three outcomes
      (A/B/C) in the instructions document each point to a different real
      fix.

      Bug found on the first hardware attempt (fixed same day, before any
      AT+CGDCONT?/AT+CGACT?/AT+CGPADDR data was collected): the init
      script's diagnostic block was placed AFTER AT+CMUX=0,0,5,127 instead
      of before it. The instant that command gets OK the modem switches
      into CMUX framing, so the plain-text AT+CGDCONT? sent right after
      went completely unrecognized - the init script hung for its full 30s
      timeout, retried 3 times (each also timing out on the bare "AT"
      probe, since the modem was left in a confused state after the first
      malformed exchange), and srvNetwork's own 120s connect timeout ended
      the round with result=-116. Fixed by moving all three diagnostic
      reads to before AT+CMUX=0,0,5,127 (still correct for what they need
      to measure - this is still before the framework's own APN script
      ever runs, just also before the CMUX switch). Not yet re-tested on
      hardware - next step once the user reports the
      AT+CGDCONT?/AT+CGACT?/AT+CGPADDR responses from both points.

      Diagnosis result (next hardware test, same commit as the placement
      fix above): the three AT+CGDCONT?/AT+CGACT?/AT+CGPADDR=1 readings
      were identical before and after the framework's generic APN script
      ran - +CGDCONT: 1,"IP","gsfleet.cxn","<ip>",0,0, +CGACT: 1,1 (already
      active), same IP both times. PDP context 1 was rock-stable the whole
      round; none of the instructions document's three hypotheses (A/B/C)
      literally applied. A Joulescope current trace correlated against the
      log resolved it anyway: current sits at an idle ~3.3mA baseline right
      after CMUX connects, then jumps into sustained 100-125mA RF
      re-signaling bursts for >2s starting within 50ms of the framework
      sending AT+CGDCONT=1,"IP","gsfleet.cxn" (the rewrite) - not a brief
      RACH blip, continuing straight through AT+CGACT=0,1/AT+CEREG?/ATD/
      CONNECT. The rewrite itself, even though it writes a value already
      correctly stored (confirmed via the AT manual's own
      RequireDataStoreAtPowerDown=Yes for AT+CGDCONT and the diagnostic
      reads above), is what triggers an RRC idle->connected reconnect -
      Finding A's spirit (the rewrite disturbs things), via re-signaling
      rather than literal deactivation.

      Real fix (same day): the actual "only write if different" fix would
      need to live in Zephyr's generic modem_cellular_build_apn_script()/
      RUN_APN_SCRIPT - shared framework code, not LE270-specific. Found a
      better option already built into the framework instead:
      zephyr,use-default-pdp-ctx (a devicetree property, documented in
      zephyr,cellular-modem-device.yaml, consumed in
      modem_cellular_open_dlci2_event_handler()) skips RUN_APN_SCRIPT
      entirely, relying purely on whatever the modem already has
      configured. Set to 1 in boards/le270.overlay (not in this driver
      file) - zero framework or vendor-driver C changes. Confirmed on
      hardware the same day: ATD->CONNECT dropped from 1.417s to 0.21s
      (exactly matching the instructions document's "fast" baseline),
      power-on->IP-up dropped from 3.867s to 2.461s, total round from
      8.095s to 6.691s, all with result=0. Change 1 from the instructions
      document is done.

      2026-10-05 (Change 2): removed the now-complete temporary diagnostic
      reads from both the init and dial scripts (their job was done once
      Change 1's root cause was confirmed). Also trimmed the .shutdown
      script's post-AT+CPWROFF settle 3000ms->1000ms per the instructions
      document's Change 2: a Joulescope trace showed modem current
      reaching 0 within 0.39-0.51s of AT+CPWROFF's OK on all 3 tests, but
      neither manual documents a minimum wait specifically after that
      command's OK before cutting power (the Hardware Guide's >=5s figure
      is for the PWRKEY/hardware power-off method specifically; the AT
      manual's own MaxResponseDuration=3000ms for +CPWROFF is how long the
      OK itself may take, not a post-OK requirement) - confirmed with the
      user there's no LE270 status/V_INT pin wired on this board to detect
      power-off directly, so per the instructions document's own fallback
      for that case, used ~2x the worst observed current-to-zero time
      (1000ms) rather than reusing an unrelated figure. Not yet verified
      on hardware - the instructions document's own acceptance criterion
      for this change is 10 consecutive clean boots with no SIM/flash
      errors, which needs real testing.

      CONFIRMED 2026-10-05 (9 consecutive rounds, reset between each):
      Change 2 passed cleanly in all 9/9 - AT command ready and +SIM READY
      appeared every boot, no SIM/flash errors, and the post-AT+CPWROFF
      settle phase measured ~1.2s consistently in every round including
      the two slow ones below. 2 of the 9 rounds (not caused by Change 2)
      ran long for two different, unrelated reasons:
      - One round: AT+CEREG? read "0,2" (searching) at the exact moment
        the dial script checked it, so ATD took 4.21s instead of 0.21s -
        pure network-timing variance, exactly the scenario Change 3 below
        is meant to fix.
      - One round: net_if_down(PPP) itself stalled ~6s before returning
        (unrelated to this driver file - NO CARRIER arrived from the
        network right as the app's own disconnect began, and Zephyr's
        generic PPP L2 stack appears to time out trying to negotiate an
        LCP termination handshake with an already-dead peer). Not covered
        by any change in the instructions document; tracked separately,
        not actioned as part of this optimization pass.

      2026-10-05 (Change 3): added AT+CGACT=1,1 (hard ok_match) to the dial
      script, right after the existing AT+CEREG? read, as the real
      registration gate before ATD. Deliberately did NOT implement the
      instructions document's own suggested approach (enabling AT+CEREG=1
      unsolicited URCs) - this project already has a confirmed
      hardware-verified bug for that exact command on this module (see the
      2026-10-02 entry above: it broadcasts +CEREG: URCs identically on
      all three open CMUX DLCIs, which previously broke every connection
      by racing the PPP handover). Re-enabling it to satisfy this change
      would reintroduce that bug. AT+CGACT=1,1's own documented behavior
      (AT Commands User Manual V1.6 sec 11.4: performs a PS attach first
      if not already attached, succeeds as a no-op if context 1 is already
      active, fails with ERROR if attach genuinely fails) already gives
      the wait-with-timeout-then-fail-cleanly behavior the instructions
      document asked for, using modem_cellular's own existing dial-script
      retry logic (MODEM_CELLULAR_MAX_SCRIPT_FAILURES=3) - no new
      state-machine code needed. Raised the dial script's whole-script
      timeout 90s->120s to match the new documented worst-case sum
      (108s) with margin, and to align with srvNetwork's own
      CONFIG_FIREFLY_NETWORK_CONNECT_TIMEOUT_S, per the instructions
      document's own suggested 60-120s range. Not yet verified on
      hardware - the instructions document's acceptance criteria are no
      timing regression in good coverage, and a clean timeout+shutdown
      with the antenna removed or RF shielded.

      CONFIRMED 2026-10-05 (7 rounds): Change 3 passed. All 7/7 succeeded
      (result=0), AT+CGACT=1,1 worked exactly as designed in the one round
      where it mattered - AT+CEREG? read "0,2" (searching) before dialing,
      so AT+CGACT=1,1 took the wait on itself (~4.8s to complete the
      attach internally) and only returned once truly registered, with the
      subsequent ATD*99***1# staying fast (0.21s) regardless. The 5
      already-registered rounds showed zero timing regression (identical
      ~4.6s totals to before this change). Two further unrelated findings,
      tracked separately and not actioned (same treatment as the
      net_if_down() stall entry above): one round's init script got zero
      response to AT+CEREG? for a full 30s (its own existing timeout then
      automatically retried the whole init script, which completed
      normally in milliseconds on the second attempt - not caused by, or
      related to, anything in this driver file; no code change needed
      since the framework's own existing retry logic already handled it
      gracefully).

      2026-10-05 (Change 4): wakes AWAIT_POWER_ON on the "AT command
      ready" URC instead of waiting out the full startup_time_ms fixed
      timer. Uses modem_cellular's own existing mechanism for this
      (modem_cellular_chat_on_modem_ready / MODEM_CELLULAR_EVENT_MODEM_
      READY, already wired to MODEM_CELLULAR_COMMON_UNSOL_MATCHES for
      other modems' "APP RDY"/"Ready" URCs) - no framework changes,
      just adding this module's own URC text to fibocom_le270_unsol's
      match table, exactly the extension pattern that macro is designed
      for. Chose "AT command ready" over the instructions document's
      primary suggestion of "+SIM READY", per the document's own "earlier
      alternative, if the init script doesn't depend on the SIM" -
      already true here (every init-script command was audited for SIM
      dependence when AT+CIMI was removed earlier). Exact URC text
      verified against AT Commands User Manual V1.6 sec 4.14 (+MSTART,
      p.51-52), which documents the module's own boot URCs as literally
      "AT command ready" and "+SIM READY" (both enabled by default).
      startup_time_ms raised 1200ms->3000ms per the instructions
      document's own guidance to keep it as a real fallback margin now
      that it's no longer the primary mechanism - the URC path handles
      the normal case; this only matters if "AT command ready" is ever
      missed or garbled. Not yet verified on hardware - acceptance
      criteria are the init script starting within 20ms of the URC, and
      an error-free boot sequence across 10 rounds.

      CONFIRMED 2026-10-05/06: Change 4's own acceptance criterion passed
      cleanly across all rounds tested - init script start measured ~0.22ms
      after "AT command ready" (well under the 20ms target), and AT
      command ready now shows as a matched command rather than "unknown".
      But a serious, separate finding surfaced in the same test: one round
      reported success (result=0) and then, with no button press,
      automatically redialed on its own several minutes later, succeeded
      once, then failed 3 times in a row (each burning a full 120s
      timeout - the budget raised in the Change 3 entry above), and ended
      with the modem rebooting mid-shutdown. Root-caused and fixed in
      modem-cellular-suspend-during-ppp-dead.patch (see that entry for the
      full mechanism) - a genuine framework gap, not something fixable
      within this vendor driver file alone. This also likely explains the
      net_if_down() multi-second stall finding noted earlier in this
      changelog. Not yet re-verified on hardware after that fix.

      CONFIRMED 2026-10-06 (9 consecutive rounds): the suspend-during-
      ppp-dead fix held, but a separate real-hardware zombie-redial
      cascade (403s/4 timeouts) surfaced from a different mechanism -
      net_if_down(PPP) deterministically stalling 9.003s because this
      module never acks PPP's LCP Terminate-Request (sends NO CARRIER
      instead), which Zephyr's generic PPP L2 doesn't treat as a carrier
      drop. Fixed via Kconfig only (CONFIG_NET_L2_PPP_TIMEOUT/
      MAX_TERMINATE_REQ_RETRANSMITS in conf/modem_le270.conf, not this
      driver file) - see that conf file's own comment and the
      project_modem_consolidation.md memory for the full diagnosis,
      including a same-day regression (RETRANSMITS=0 looked faster but
      triggered a real Zephyr fsm.c bug that permanently broke PPP after
      round 1) and its fix (RETRANSMITS=1). Both confirmed on hardware:
      9/9 consecutive rounds clean, net_if_down(PPP) consistently ~15ms-1s
      instead of 9s.

      2026-10-06 (Change 5, LE270_driver_optimisation_instructions.md):
      real hardware logs showed a ~200ms fixed gap between CMUX fully
      disconnecting and AT+CPWROFF being sent during shutdown, with the
      modem still RRC-connected at ~30mA the whole time - traced to
      modem_cellular_init_power_off_event_handler() reusing
      reset_pulse_duration_ms (200ms, documented against this module's
      RESET_N pulse width spec, a GPIO not even wired on this board) as a
      generic "let the UART settle after CMUX teardown" delay. Took the
      document's Option B (the simpler of the two offered - Option A,
      sending AT+CPWROFF before closing CMUX at all, would need
      restructuring shared modem_cellular.c state-machine ordering used
      by every vendor driver, too large a change right after today's PPP
      Kconfig regression already showed how a shared-timing edit can have
      non-obvious side effects). Added a new, separate
      shutdown_cmux_settle_ms vendor-config field (see
      modem-cellular-power-off-pulse.patch's own changelog) instead of
      just shrinking reset_pulse_duration_ms directly, specifically so
      this driver's unrelated, already-hardware-verified AWAIT_PPP_DEAD
      CEREG-duplication-race recovery timing (documented a few lines above
      this struct) is left untouched. Set to 20ms, the top of the
      document's suggested 10-20ms range, falling back to the old 200ms
      behavior if ever set back to 0. Acceptance criterion: under 50ms
      between "CMUX disconnected" and AT+CPWROFF OK. Not yet verified on
      hardware - next test after this build.
