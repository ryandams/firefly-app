# Real hardware.

# Segger SystemView (requirement 2). RTT-based, so device only - this must
# never appear in the native_sim configuration.
CONFIG_SEGGER_SYSTEMVIEW=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_TRACING=y
# Rebuild the RTT control block at every boot. It sits in RAM that a warm
# reset (flash, J-Link reset, reboot) does not clear, and the default
# STRONG_CHECK mode keeps it whenever its ID survived - so each boot's
# SystemView allocated one more "SysView" channel until none was left, then
# used channel 255 and bus-faulted on the first traced event. No bootloader
# shares RTT with this app, so nothing needs the old block kept.
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y
# ISR names in SystemView (handler function names via the symbol table).
CONFIG_SYMTAB=y

CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096

# Storage / bootloader come in as the drivers land.
