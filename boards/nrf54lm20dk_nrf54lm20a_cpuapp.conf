# Real hardware.

# Segger SystemView (requirement 2). RTT-based, so device only - this must
# never appear in the native_sim configuration.
CONFIG_SEGGER_SYSTEMVIEW=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_TRACING=y

CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096

# Storage / bootloader come in as the drivers land.
# CONFIG_NVS=y
# CONFIG_ZMS=y
# CONFIG_FLASH=y
# CONFIG_FLASH_MAP=y
# CONFIG_FCB=y
# CONFIG_BOOTLOADER_MCUBOOT=y

# CONFIG_BT=y
# CONFIG_BT_CENTRAL=y

# ---------------------------------------------------------------------------
#  srvNetwork: nRF93M1 modem over uart30 (PPP, CMUX-multiplexed with AT)
# ---------------------------------------------------------------------------
#  Settings below mirror nRF Connect SDK's own nrf93m1dk/ppp_shell sample
#  (same modem, same driver, same CMUX/PPP stack) - just pointed at this
#  board's own free UART instead of the nRF93M1 DK's on-board wiring.
CONFIG_FIREFLY_NETWORK=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# Network management (drives the L4-connected event srvNetwork waits on)
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y

# Modem driver
CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y

# Same SIM/carrier as the nRF93M1 DK - MODEM_CELLULAR_APN defaults to
# "internet" if left unset, which this carrier rejects.
CONFIG_MODEM_CELLULAR_APN="gsfleet.cxn"

CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_USE_DEDICATED_WQ=y

# AT command channel over CMUX's second DLCI, available at the same time as
# the PPP data channel on the first - this is what makes AT commands and PPP
# usable simultaneously, and it is CMUX doing that, not extra app code.
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_MODEM_AT_SHELL=y
CONFIG_MODEM_AT_USER_PIPE_IDX=0
CONFIG_MODEM_AT_SHELL_CHAT_RECEIVE_BUF_SIZE=256

# UART async API + buffer sizes, matching Nordic's own tuning for this modem
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_ASYNC_API=y
CONFIG_SHELL_BACKEND_SERIAL_API_ASYNC=y
CONFIG_MODEM_BACKEND_UART_ASYNC_HWFC=y
CONFIG_MODEM_BACKEND_UART_ASYNC_RECEIVE_IDLE_TIMEOUT_MS=1
CONFIG_MODEM_CMUX_MTU=127
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE_EXTRA=532
CONFIG_MODEM_CELLULAR_UART_BUFFER_SIZES=532
CONFIG_MODEM_CMUX_MSC_FC_THRESHOLD=32
CONFIG_MODEM_CELLULAR_USER_PIPE_BUFFER_SIZES=1024

CONFIG_MODEM_CMUX_LOG_LEVEL_INF=y
CONFIG_MODEM_MODULES_LOG_LEVEL_INF=y
