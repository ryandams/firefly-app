# Real hardware.
CONFIG_FIREFLY_PORT_HOST=n

# Segger SystemView (requirement 2). RTT-based, so device only - this must
# never appear in the native_sim configuration.
CONFIG_SEGGER_SYSTEMVIEW=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_TRACING=y

CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=y

