# ---------------------------------------------------------------------------
#  Modem selection
# ---------------------------------------------------------------------------
#  This board has no modem wired up by default (FIREFLY_MODEM_SERVICE stays
#  at its Kconfig default of FIREFLY_MODEM_SERVICE_NONE) - there is nothing
#  on-board here, unlike nrf93m1dk. Each externally-wired modem this project
#  supports gets its own additive conf/boards-overlay fragment pair instead
#  of living in this file, so a build target picks exactly one modem rather
#  than this file trying to be all of them at once (they use overlapping
#  UART instances and pins and are mutually exclusive on real hardware):
#
#    conf/modem_eg800z.conf      + boards/eg800z.overlay      (uart21)
#    conf/modem_le270.conf       + boards/le270.overlay       (uart21)
#    conf/modem_nrf93m1_ext.conf + boards/nrf93m1_ext.overlay (uart30)
#
#  CONFIG_FIREFLY_TARGET_MODEM_* in prj.conf picks the pair; CMakeLists.txt
#  adds it, plus conf/echo_server.conf. The nrf93m1dk board instead uses
#  its on-board modem via conf/modem_nrf93m1.conf, with no overlay.
