# Host build. No radio, no BLE stack, no real drivers.
CONFIG_FIREFLY_PORT_HOST=y

CONFIG_LOG_BACKEND_NATIVE_POSIX=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Deliberately NOT set here:
#   CONFIG_BT              - see port/host/hostPorts.cpp; BLE is faked at the
#                            port boundary, not by a fake HCI driver
#   CONFIG_SEGGER_SYSTEMVIEW - RTT does not exist on the host

# Storage logic can still be exercised on the host through Zephyr's
# flash simulator once port/zephyr's store adapter is written:
# CONFIG_FLASH=y
# CONFIG_FLASH_SIMULATOR=y
# CONFIG_FLASH_MAP=y
# CONFIG_FCB=y
