# Host build. No radio, no BLE stack, no real drivers.
CONFIG_LOG_MODE_IMMEDIATE=y

# GPIO isn't on by default on native_sim (unlike the DK). srvController's
# LED blink needs it; boards/native_sim.overlay supplies led1..led3 via the
# emulated controller that comes with it.
CONFIG_GPIO=y
