# Real hardware - the nRF93M1 DK. Unlike nrf54lm20dk_nrf54lm20a_cpuapp.conf,
# no devicetree overlay is needed here: this board's own base devicetree
# already defines &modem under uart30 and the "modem" alias.

# ---------------------------------------------------------------------------
#  srvModemTest_nrf93m1: raw-AT modem test over uart30 (no PPP/CMUX)
# ---------------------------------------------------------------------------
#  FIREFLY_MODEM_SERVICE is a Kconfig choice - FIREFLY_MODEM_TEST_NRF93M1 and
#  FIREFLY_NETWORK (below, active) can't both be y at once.
CONFIG_FIREFLY_MODEM_TEST_NRF93M1=y
CONFIG_MODEM=n
CONFIG_NETWORKING=n

# ---------------------------------------------------------------------------
#  srvNetwork: nRF93M1 modem over uart30 (PPP, CMUX-multiplexed with AT)
# ---------------------------------------------------------------------------
#  This is the on-board modem the nrf93m1dk/ppp_shell sample targets, so the
#  UART-tuning values below are copied from that sample's own board fragment
#  verbatim rather than re-derived. To switch back to raw-AT: comment out
#  everything below, then uncomment the three lines above.
# CONFIG_FIREFLY_NETWORK=y

# Zephyr IPv4-over-PPP network stack used by srvNetwork.
# CONFIG_NETWORKING=y
# CONFIG_NET_NATIVE=y
# CONFIG_NET_L2_PPP=y
# CONFIG_NET_L2_ETHERNET=n
# CONFIG_NET_IPV4=y
# CONFIG_NET_IPV6=n
# CONFIG_NET_UDP=y
# CONFIG_NET_TCP=n
# CONFIG_NET_SOCKETS=y
# CONFIG_POSIX_API=y
# CONFIG_NET_MGMT=y
# CONFIG_NET_MGMT_EVENT=y
# CONFIG_NET_CONNECTION_MANAGER=y

# nRF93M1 cellular modem driver. MODEM_CELLULAR requires NET_L2_PPP.
# CONFIG_MODEM=y
# CONFIG_MODEM_CELLULAR=y

# MODEM_CELLULAR_APN defaults to "internet" (Kconfig default) if left unset,
# which this SIM's carrier rejects - the dial phase's CGDCONT never attaches
# to a usable PDP context, so PPP/IPCP hangs and NET_EVENT_L4_CONNECTED never
# fires. Same APN as the raw-AT test's FIREFLY_MODEM_TEST_APN default.
CONFIG_MODEM_CELLULAR_APN="gsfleet.cxn"

# UDP echo server for end-to-end verification. 172.188.83.251 48695
CONFIG_FIREFLY_MODEM_TEST_SERVER_IP="172.188.83.251"
CONFIG_FIREFLY_MODEM_TEST_SERVER_PORT=48695
CONFIG_FIREFLY_NETWORK_DEST_IP="172.188.83.251"
CONFIG_FIREFLY_NETWORK_DEST_PORT=48695
CONFIG_FIREFLY_NETWORK_MESSAGE="test,message,GSFleet,0123456789"

# UART async API + buffer sizes, copied from nrf93m1dk/ppp_shell's own board
# overlay conf - this is the DK this modem/driver combination was tuned for.
CONFIG_MODEM_BACKEND_UART_ASYNC_HWFC=y
CONFIG_MODEM_BACKEND_UART_ASYNC_RECEIVE_IDLE_TIMEOUT_MS=1

# Required nRF93M1 CMUX sizing from Nordic's nrf93m1dk/ppp_shell board
# configuration. The generic CMUX default MTU is only 31 bytes, producing a
# 38-byte DLCI work buffer; modem_cmux requires every DLCI RX buffer >=126.
CONFIG_MODEM_CMUX_MTU=127
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE_EXTRA=532
CONFIG_MODEM_CELLULAR_UART_BUFFER_SIZES=532
CONFIG_MODEM_CMUX_MSC_FC_THRESHOLD=32
CONFIG_MODEM_CELLULAR_USER_PIPE_BUFFER_SIZES=1024

# Full debug logging while bringing up the modem: modem_cellular.c's own
# state/event transitions (CONFIG_MODEM_LOG_LEVEL), modem_chat's sent/
# received AT bytes and modem_ppp/backend traffic (MODEM_MODULES), and CMUX
# framing (MODEM_CMUX). Drop back to _INF once the link is up and stable.
CONFIG_MODEM_LOG_LEVEL_DBG=y
CONFIG_MODEM_MODULES_LOG_LEVEL_DBG=y
CONFIG_MODEM_CMUX_LOG_LEVEL_DBG=y

# ---------------------------------------------------------------------------
#  Shared by both modes above
# ---------------------------------------------------------------------------
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_USE_DEDICATED_WQ=y

# Raw-AT mode uses these directly (uart_configure/uart_rx_enable/uart_callback_set,
# a manual ring buffer, and float-formatted printk in its phase report); PPP
# mode's modem backend also needs the async UART API underneath it.
# Shell on the console UART, for the "modem on/off/at <cmd>" commands
# srvModemTest_nrf93m1.cpp registers. Those exist because Zephyr's own
# MODEM_AT_SHELL cannot work in this mode: it needs MODEM_AT_USER_PIPE, which
# attaches to a pipelink only drivers/modem/modem_cellular.c publishes, and
# CONFIG_MODEM=n above means that driver is not built.
#
# SHELL_BACKEND_SERIAL_API_ASYNC is required, not optional: UART_INTERRUPT_DRIVEN
# is n below, so the shell's serial backend has no interrupt-driven path to use.
#
# No LOG_BACKEND_UART line needed - it is "default y if !SHELL_BACKEND_SERIAL",
# so enabling the shell hands the console to SHELL_LOG_BACKEND instead of
# leaving two backends writing the same UART and printing every line twice.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_API_ASYNC=y

CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_ASYNC_API=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_RING_BUFFER=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# The raw modem test emits complete AT transcripts while the regular deferred
# logger is also active. Give the logger enough queue space for messages that
# arrive while the console is busy printing the transcript.
CONFIG_LOG_BUFFER_SIZE=16384
