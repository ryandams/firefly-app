# Real hardware - the nRF93M1 DK. The on-board modem is configured in
# conf/modem_nrf93m1.conf.

# Segger SystemView over RTT, as on the nRF54LM20 DK. Device only, never
# native_sim; conf/production.conf turns it off again for release builds.
# SystemView allocates its own RTT channel (SEGGER_SYSVIEW_RTT_CHANNEL=0
# means auto), and recording starts when the SystemView app connects.
CONFIG_TRACING=y
CONFIG_SEGGER_SYSTEMVIEW=y
CONFIG_USE_SEGGER_RTT=y

# Rebuild the RTT control block at every boot. It sits in RAM that a warm
# reset (flash, J-Link reset, reboot) does not clear, and the default
# STRONG_CHECK mode keeps it whenever its ID survived - so each boot's
# SystemView allocated one more "SysView" channel until none was left, then
# used channel 255 and bus-faulted on the first traced event. No bootloader
# shares RTT with this app, so nothing needs the old block kept.
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y

# The on-board J-Link drains RTT far slower than a network round produces
# events (default 4 KB buffer: "*** overflow *** 5506 events lost"), so give
# the burst room to queue up. 64 KB of the nRF54L15's 256 KB RAM. The
# "sysview" shell command shows how full it got (code/helpers/sysviewWatermark.cpp).
CONFIG_SEGGER_SYSVIEW_RTT_BUFFER_SIZE=65536

# Name the ISRs in SystemView: with a symbol table, Zephyr's SystemView glue
# sends each interrupt's handler function name.
CONFIG_SYMTAB=y
